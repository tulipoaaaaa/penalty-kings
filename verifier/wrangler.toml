name = "penalty-kings-referee"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WEEK = "1"
RPC_URL = "https://rpc.mainnet.chain.robinhood.com"
ALLOWED_ORIGIN = "https://tulipoaaaaa.github.io"

# Create with: npx wrangler kv namespace create ENTRIES   (then paste the id below)
[[kv_namespaces]]
binding = "ENTRIES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never in this file):
#   npx wrangler secret put WEEK_SECRET   # 64 hex chars, generated by scripts/cup/new-week.mjs
#   npx wrangler secret put SIGNING_KEY   # ECDSA P-256 private JWK, generated by the same script
