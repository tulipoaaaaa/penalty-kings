name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the secret scan also checks every commit message and identity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret scan (mnemonics, private keys)
        run: npm run secret-scan
      - name: Engine and Director copies match packages/
        run: npm run check:engine-sync
      - run: npm run typecheck
      - name: Site builds with no dev-only code (mock wallet, Showroom)
        run: npm run build:site && npm run check:no-dev
      - name: Hand-written selectors match their signatures
        run: npm run check:selectors
      - name: Odds (sum 10000 bps, EV 90.00% for every tier)
        run: npm run verify:odds
      - name: Game logic tests (tour, daily, target, progress, ethics, prize data)
        run: npm run test:game-logic
      - name: Engine unit tests
        run: npm run test:engine
      - name: Match Director unit tests (cadence, rotation, commentary, cosmetic-only)
        run: npm run test:director
      - name: Dynamic difficulty keeps every bot profile at 55–65 % goals
        run: npm run sim:difficulty
      - name: Economy simulator smoke
        run: node scripts/economy-sim.mjs --smoke
      - name: Weekly Cup computation tests (drops, race, wildcards)
        run: npm run test:cup
      - name: Verifier tests (Skill Cup referee)
        run: npm run test:verifier
      - name: Verifier Worker bundles
        run: npm run build:verifier
      - name: FriendSDK game check
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: FriendSDK smoke test (960px and 360px)
        run: npm run test:smoke
      - name: Interaction test (buy → place → reveal → shoot → HUD)
        run: npm run test:game
      - name: Phone layouts (360×800, 390×844, 800×360, 844×390; fit, 11px text, toolbar, real swipe)
        run: npm run test:phone
      - name: Every free mode played in the real runtime (tutorial, free kicks, target, tour, daily)
        run: npm run test:modes
      - name: 90-second first-session QA (what the viewer sees, with minimums)
        run: npm run qa:90s
      - name: Action-flow audit (every awkward interleaving, 960 + 360 px)
        run: npm run test:flow
      - name: REAL ownership gate on Robinhood mainnet (read-only, no mocks)
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
        run: npm run test:real-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1 # pinned: matches local runs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the SDK contracts (BallVault tests compile the real ChanceGame from node_modules)
        run: npm ci --ignore-scripts
      - name: Forge build + unit tests
        working-directory: contracts
        run: |
          forge build
          forge test -vv --no-match-contract Fork
      - name: Mainnet-fork tests (read-only RPC; no keys in CI)
        working-directory: contracts
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
        run: forge test -vv --match-contract Fork --fork-url "$ROBINHOOD_RPC_URL"
