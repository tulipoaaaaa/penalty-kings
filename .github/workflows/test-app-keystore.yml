# Run by hand ONCE to make a keystore for the owner's Android TEST builds (com.penaltykings.test), so that every
# APK from .github/workflows/test-app.yml is signed with the same key and updates install over each other.
# It is a TEST key for a test app: never use it for a store release. Nothing is committed; the keystore and its
# passwords are only in a short-lived (1 day) artifact of this run. Copy the four values into repository secrets
# (Settings → Secrets and variables → Actions → New repository secret), then DELETE the artifact (or the whole run).
#   ANDROID_KEYSTORE_B64       contents of keystore.b64.txt
#   ANDROID_KEYSTORE_PASSWORD  contents of keystore-password.txt
#   ANDROID_KEY_ALIAS          pktest
#   ANDROID_KEY_PASSWORD       contents of keystore-password.txt (same as the store password: PKCS12)
name: Test app keystore (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate a test keystore (keytool, RSA 2048, 25 years)
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/pk-test-keystore"; mkdir -p "$dir"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          keytool -genkeypair -keystore "$dir/pk-test-release.keystore" -storetype PKCS12 -alias pktest \
            -keyalg RSA -keysize 2048 -validity 9125 -storepass "$password" -keypass "$password" \
            -dname "CN=Penalty Kings Test Build, O=Penalty Kings (Test)" -noprompt
          base64 -w0 "$dir/pk-test-release.keystore" > "$dir/keystore.b64.txt"
          printf '%s' "$password" > "$dir/keystore-password.txt"
          printf '%s' pktest > "$dir/key-alias.txt"
          cat > "$dir/README.txt" <<'EOF'
          Penalty Kings (Test) — Android test signing key. Add these repository secrets, then delete this artifact:
            ANDROID_KEYSTORE_B64       = keystore.b64.txt
            ANDROID_KEYSTORE_PASSWORD  = keystore-password.txt
            ANDROID_KEY_ALIAS          = key-alias.txt (pktest)
            ANDROID_KEY_PASSWORD       = keystore-password.txt
          Keep a private backup of pk-test-release.keystore + the password: a lost key means testers must uninstall
          once before the next update. Never commit these files.
          EOF
          keytool -list -keystore "$dir/pk-test-release.keystore" -storepass "$password" | grep -i "fingerprint"
      - uses: actions/upload-artifact@v4
        with:
          name: pk-test-android-keystore
          path: ${{ runner.temp }}/pk-test-keystore/
          retention-days: 1
      - name: Next steps
        run: |
          {
            echo "### Android test keystore generated"
            echo "1. Download the **pk-test-android-keystore** artifact below (kept for 1 day)."
            echo "2. Add the repository secrets \`ANDROID_KEYSTORE_B64\`, \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS\`, \`ANDROID_KEY_PASSWORD\` (see README.txt inside)."
            echo "3. Delete the artifact (or this run) and keep a private backup of the keystore. Never commit it."
            echo "4. Re-run **Test app**: the next APK is release-signed (testers with a *-debug.apk uninstall it once)."
          } >> "$GITHUB_STEP_SUMMARY"
