name: Pages
# The judged preview only changes after the FULL CI run for that exact commit is green
# (typecheck, friendsdk check/test, engine, verifier, game, flow, modes, QA-90s, geometry, phone widths, contracts).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, claude/clever-mccarthy-ay7qv7]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Root = Park (simulated submission preview); /pro/, /champions/ simulated;
      # /live/ only when public deployment manifests exist in games/penalty-kings/deployments/.
      - run: npm run build:site
      - run: npm run check:no-dev
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
